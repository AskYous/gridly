[project]
name = "gridly"
version = "0.1.0"
description = "A terminal spreadsheet with typed columns"
requires-python = ">=3.10"
dependencies = ["textual>=1.0"]

[project.scripts]
gridly = "gridly.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gridly"]

[tool.setuptools.package-data]
gridly = ["*.tcss"]
